name: cses_document_collab
description: Portable BlockCraft collaboration editor with Rust/Yrs and SQLite.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  appflowy_editor: 6.2.0
  crypto: ^3.0.7
  dio: ^5.11.1
  flutter_rust_bridge: 2.13.0
  provider: ^6.1.5+1
  url_launcher: ^6.3.3
  video_player: ^2.14.1
  val_highlight: ^0.1.0
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
