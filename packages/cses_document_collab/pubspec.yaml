name: cses_document_collab
description: Portable BlockCraft collaboration editor with Rust/Yrs and SQLite.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  appflowy_editor:
    path: ../appflowy_editor
  markdown: ^7.3.0
  crypto: ^3.0.7
  dio: ^5.11.1
  flutter_rust_bridge: 2.13.0
  flutter_svg: ^2.3.0
  flutter_math_fork: ^0.7.4
  webview_flutter: ^4.14.1
  metalink: ^2.1.0
  provider: ^6.1.5+1
  url_launcher: ^6.3.3
  video_player: ^2.14.1
  val_highlight: ^0.1.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.5

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_lints: ^6.0.0
  http: ^1.6.0
  file: ^7.0.1
  webview_flutter_platform_interface: ^2.15.1
  video_player_platform_interface: ^6.9.0

flutter:
  assets:
    - assets/mermaid/index.html
    - assets/mermaid/mermaid.min.js
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
