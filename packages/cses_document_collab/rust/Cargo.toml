[package]
name = "cses_collab_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
# backtrace 0.3.76 requires dyld declarations on iOS; libc 0.2.190 hides them.
libc = "=0.2.186"
once_cell = "1.21.3"
parking_lot = "0.12.5"
rusqlite = { version = "0.40.1", features = ["bundled"] }
yrs = { version = "0.27.3", features = ["small-client", "sync"] }
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[dev-dependencies]
tempfile = "3.23.0"
