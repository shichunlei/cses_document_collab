name: cses_mobile_collab_demo
description: Demo host for the portable CSES document collaboration package.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cses_document_collab:
    path: packages/cses_document_collab
  cses_common:
    path: ../cses.common
  crypto: ^3.0.7
  dio: ^5.11.1
  file_picker: ^13.1.0
  mime: ^2.1.0
  path_provider: ^2.1.6

# Resolve the same patched editor for the host and its transitive package.
dependency_overrides:
  appflowy_editor:
    path: ../cses.plugins/appflowy_editor

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  appflowy_editor: 6.2.0

flutter:
  uses-material-design: true
