name: cses_mobile_collab_demo
description: Demo host for the portable CSES document collaboration package.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cses_document_collab:
    path: packages/cses_document_collab
  cses_common:
    path: ../cses/cses.common
  crypto: ^3.0.7
  dio: ^5.11.1
  path: ^1.9.1
  path_provider: ^2.1.6

dev_dependencies:
  appflowy_editor:
    path: packages/appflowy_editor
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
