[package]
name = "cses-y-websocket-demo-server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8.6", features = ["ws"] }
futures-util = "0.3.31"
parking_lot = "0.12.5"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
yrs = { version = "0.27.3", features = ["small-client", "sync"] }
