name: cses_mobile_collab_demo
description: Demo host for the portable CSES document collaboration package.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cses_document_collab:
    path: ..
  cses_common:
    path: ../../cses/cses.common
  appflowy_editor:
    path: ../packages/appflowy_editor
  provider: ^6.1.5+1
  lucide_icons_flutter: ^4.0.1
  crypto: ^3.0.7
  dio: ^5.11.1
  file_picker: ^13.3.0
  mime: ^2.1.0
  path: ^1.9.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/daily_guidance_mountain.png
